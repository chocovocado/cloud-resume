name: Deploy

on:
  push:
    branches: [main]
    
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-backend:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
        - run: pip install pytest moto boto3
        - run: pytest backend/tests
    
  terraform:
      needs: test-backend
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: infra
      outputs:
          bucket: ${{ steps.out.outputs.bucket }}
          dist_id: ${{ steps.out.outputs.dist_id }}
      steps:
        - uses: actions/checkout@v4
        - name: Debug OIDC subject
          run: |
            python3 - <<'EOF'
            import os, json, base64, urllib.request
            url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
            req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
            token = json.load(urllib.request.urlopen(req))["value"]
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            claims = json.loads(base64.urlsafe_b64decode(payload))
            print({k: claims.get(k) for k in ("sub", "aud", "repository")})
            EOF
        - uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: us-east-1
        - uses: hashicorp/setup-terraform@v3
          with: 
            terraform_wrapper: false
        - run: terraform init -input=false
        - name: Read outputs
          id: out
          run: |
            echo "bucket=$(terraform output -raw site_bucket)" >> "$GITHUB_OUTPUT"
            echo "dist_id=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT" 
    
  deploy-frontend:
      needs: terraform
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: us-east-1
        - run: aws s3 sync frontend/ s3://${{ needs.terraform.outputs.bucket }} --delete
        - run : >
            aws cloudfornt create-invalidation
            --distribution-id ${{ needs.terraform.outputs.dist_id }}
            --paths "/*"